name: naseej
description: "Naseej is a bilingual AI-assisted family skill exchange application for SMAC 2026."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_localizations:
    sdk: flutter

  intl: any
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  firebase_core: ^4.13.0
  firebase_ai: ^3.15.0
  firebase_app_check: ^0.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true